[project]
name = "prentice"
version = "0.1.0"
description = "Records a desktop workflow and converts it into a Claude Code SKILL.md."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.6",
    "pydantic>=2.6",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.1; sys_platform == 'darwin'",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "mlx-vlm>=0.6.17; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
prentice-capture = "prentice.capture.session:main"
prentice-segment = "prentice.segment.pipeline:main"
prentice-interpret = "prentice.interpret.pipeline:main"
prentice-refine = "prentice.refine.pipeline:main"
prentice-ground = "prentice.ground.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prentice"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-ignore = [
    "EXE002", # false positive: external-drive mount marks all files executable
    "BLE001", # deliberate: AX/window-tracker lookups are best-effort, must never raise
    "SIM115", # file handle intentionally outstrips a `with` block (session-lifetime log file)
]
